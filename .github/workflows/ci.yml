name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: pwsh -NoProfile -File ./Scripts/build.ps1
      - run: pwsh -NoProfile -File ./Scripts/test.ps1

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: pwsh -NoProfile -File ./Scripts/go-build.ps1
      - run: pwsh -NoProfile -File ./Scripts/go-test.ps1
